name: Kontrola návrhu

# Jen zkompiluje větev návrhu (navrh-…) – nic nevydává, rádio nic nenabídne.
on:
  push:
    branches: [ 'navrh-*' ]
  workflow_dispatch:
    inputs:
      branch:
        description: Větev ke kontrole
        required: true
        default: navrh-2.14

permissions:
  contents: read

concurrency:
  group: check-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Zkompilovat návrh
    runs-on: ubuntu-latest
    steps:
      - name: Stažení kódu
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Kompilace
        run: gradle :app:assembleDebug --stacktrace

      - name: APK ke stažení (jen pro zkoušku)
        uses: actions/upload-artifact@v4
        with:
          name: Dash407-navrh-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
