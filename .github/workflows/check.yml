name: Kontrola návrhu

# Jen zkompiluje větev návrhu (navrh-…) – nic nevydává, rádio nic nenabídne.
on:
  push:
    branches: [ 'navrh-*' ]
  workflow_dispatch:
    inputs:
      branch:
        description: Větev ke kontrole
        required: true
        default: navrh-3.0

permissions:
  contents: write

concurrency:
  group: check-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Zkompilovat návrh
    runs-on: ubuntu-latest
    steps:
      - name: Stažení kódu
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Stejné sestavení jako při vydání (od 3.0 ostré s R8), aby se chyby ukázaly už u návrhu.
      - name: Kompilace
        run: |
          if [ -f app/proguard-rules.pro ]; then
            gradle :app:assembleRelease --stacktrace
            mkdir -p app/build/outputs/apk/debug && cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk
          else
            gradle :app:assembleDebug --stacktrace
          fi

      # Snímky widgetů ze skutečného kódu (Paparazzi). Test i plugin se přidají jen tady,
      # build.gradle.kts v repozitáři zůstává beze změny, takže do APK se nic nedostane.
      - name: Nástroje pro snímky (z main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main
          sparse-checkout: .github/snapshots

      - name: Snímky widgetů
        continue-on-error: true
        run: |
          mkdir -p app/src/test/java/cz/kuba/dash407
          cp _main/.github/snapshots/*.kt app/src/test/java/cz/kuba/dash407/
          rm -rf _main
          sed -i 's/^    id("org.jetbrains.kotlin.plugin.compose")$/&\n    id("app.cash.paparazzi") version "1.3.5"/' app/build.gradle.kts
          gradle :app:recordPaparazziDebug --stacktrace

      - name: Snímky ke stažení
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dash407-snimky
          path: app/src/test/snapshots/images/
          retention-days: 14
          if-no-files-found: warn

      # Kopie snímků do větve „snimky“ (složka podle větve návrhu), aby si je Claude mohl stáhnout přes git.
      # Jen ukázková data – žádné kontakty ani klíče.
      - name: Snímky do větve snimky
        if: always()
        continue-on-error: true
        env:
          SRC: ${{ inputs.branch || github.ref_name }}
        run: |
          [ -d app/src/test/snapshots/images ] || exit 0
          cp -r app/src/test/snapshots/images /tmp/snimky
          cd /tmp && rm -rf pub && mkdir pub && cd pub
          git init -q && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin snimky; then git checkout -q -b snimky FETCH_HEAD; else git checkout -q --orphan snimky; fi
          rm -rf "$SRC" && mkdir -p "$SRC" && cp /tmp/snimky/*.png "$SRC/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Snímky widgetů: $SRC [skip ci]" && git push -q origin snimky

      - name: APK ke stažení (jen pro zkoušku)
        uses: actions/upload-artifact@v4
        with:
          name: Dash407-navrh-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
