name: Sestavení APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Sestavit a vydat APK
    runs-on: ubuntu-latest
    steps:
      - name: Stažení kódu
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Zdroje se do repozitáře nahrávají jako jeden balíček upload/src.zip.
      # Tady se rozbalí místo dosavadních souborů (workflow a klíč zůstávají).
      - name: Rozbalení nahraných zdrojů
        run: |
          if [ -f upload/src.zip ]; then
            cp upload/src.zip /tmp/src.zip
            git ls-files | grep -v -E '^(\.github/|keystore/)' | xargs -r -d '\n' git rm -q --
            unzip -o -q /tmp/src.zip -d .
            git add -A
          fi

      # Stálý podpisový klíč: vytvoří se jednou a uloží do repozitáře, aby šly
      # nové verze instalovat přes staré. Je to klíč jen pro tuhle osobní aplikaci.
      - name: Podpisový klíč
        run: |
          if [ ! -f keystore/dash407.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/dash407.jks -storepass dash407 -keypass dash407 \
              -alias dash407 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dash407"
            git add keystore/dash407.jks
          fi

      - name: Uložení změn do repozitáře
        run: |
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Rozbalení zdrojů a podpisový klíč [skip ci]"
            git push
          fi

      - name: Sestavení
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleDebug --stacktrace

      # Verze se bere z versionName v app/build.gradle.kts (např. 2.0).
      # Když vydání s touto verzí už existuje, přidá se číslo sestavení (2.0.57).
      - name: Verze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts | head -1)
          [ -z "$VERSION" ] && VERSION="0.1.${{ github.run_number }}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then VERSION="$VERSION.${{ github.run_number }}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Verze: $VERSION"

      - name: Přejmenování APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Dash407-$VERSION.apk"

      - name: Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Dash407-apk
          path: Dash407-*.apk

      - name: Vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Automatické sestavení z větve main. Stáhni soubor APK a nainstaluj ho v autorádiu."
          if [ -f .github/release-notes.md ]; then
            gh release create "v$VERSION" "Dash407-$VERSION.apk" --title "Dash 407 – verze $VERSION" --notes-file .github/release-notes.md --latest
          else
            gh release create "v$VERSION" "Dash407-$VERSION.apk" --title "Dash 407 – verze $VERSION" --notes "$NOTES" --latest
          fi
